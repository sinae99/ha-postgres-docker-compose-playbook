      - -lc
      - |
        set -euo pipefail
        mkdir -p /var/lib/postgres/pgaf /var/lib/postgres/backup /var/lib/postgres/pg_autoctl-home
        chown -R postgres:postgres /var/lib/postgres
        chmod 700 /var/lib/postgres/pgaf /var/lib/postgres/backup
