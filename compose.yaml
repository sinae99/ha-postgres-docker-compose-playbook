name: postgres-local-ha

services:
  pg-monitor:
    image: citusdata/pg_auto_failover:latest
    container_name: pg-monitor
    hostname: pg-monitor
    restart: unless-stopped
    user: "0:0"
    environment:
      PGDATA: /var/lib/postgres/pgaf
      PGSSLMODE: disable
      HOME: /var/lib/postgres/pg_autoctl-home
    ports:
      - "127.0.0.1:5500:5432"
    volumes:
      - monitor_pgdata:/var/lib/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U autoctl_node -d pg_auto_failover"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        mkdir -p /var/lib/postgres/pgaf /var/lib/postgres/pg_autoctl-home
        chown -R postgres:postgres /var/lib/postgres
        chmod 700 /var/lib/postgres/pgaf
        CONFIG_FILE=/var/lib/postgres/pg_autoctl-home/.config/pg_autoctl/var/lib/postgres/pgaf/pg_autoctl.cfg
        if [ ! -s "$$CONFIG_FILE" ]; then
          su - postgres -c "HOME=/var/lib/postgres/pg_autoctl-home pg_autoctl create monitor --pgdata /var/lib/postgres/pgaf --pgport 5432 --auth trust --no-ssl"
        fi
        exec su - postgres -c "HOME=/var/lib/postgres/pg_autoctl-home pg_autoctl run --pgdata /var/lib/postgres/pgaf"

  pg-node1:
    image: citusdata/pg_auto_failover:latest
    container_name: pg-node1
    hostname: pg-node1
    restart: unless-stopped
    user: "0:0"
    depends_on:
      pg-monitor:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgres/pgaf
      PGSSLMODE: disable
      HOME: /var/lib/postgres/pg_autoctl-home
    ports:
      - "127.0.0.1:5541:5432"
    volumes:
      - node1_pgdata:/var/lib/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        mkdir -p /var/lib/postgres/pgaf /var/lib/postgres/backup /var/lib/postgres/pg_autoctl-home
        chown -R postgres:postgres /var/lib/postgres
        chmod 700 /var/lib/postgres/pgaf /var/lib/postgres/backup
        CONFIG_FILE=/var/lib/postgres/pg_autoctl-home/.config/pg_autoctl/var/lib/postgres/pgaf/pg_autoctl.cfg
        if [ ! -s "$$CONFIG_FILE" ]; then
          su - postgres -c "HOME=/var/lib/postgres/pg_autoctl-home pg_autoctl create postgres --pgdata /var/lib/postgres/pgaf --pgport 5432 --hostname pg-node1 --monitor postgres://autoctl_node@pg-monitor:5432/pg_auto_failover?sslmode=disable --auth trust --no-ssl"
        fi
        exec su - postgres -c "HOME=/var/lib/postgres/pg_autoctl-home pg_autoctl run --pgdata /var/lib/postgres/pgaf"

  pg-node2:
