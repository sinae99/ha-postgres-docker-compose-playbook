      retries: 30
      start_period: 15s
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        mkdir -p /var/lib/postgres/pgaf /var/lib/postgres/backup /var/lib/postgres/pg_autoctl-home
        chown -R postgres:postgres /var/lib/postgres
        chmod 700 /var/lib/postgres/pgaf /var/lib/postgres/backup
        CONFIG_FILE=/var/lib/postgres/pg_autoctl-home/.config/pg_autoctl/var/lib/postgres/pgaf/pg_autoctl.cfg
        if [ ! -s "$$CONFIG_FILE" ]; then
          su - postgres -c "HOME=/var/lib/postgres/pg_autoctl-home pg_autoctl create postgres --pgdata /var/lib/postgres/pgaf --pgport 5432 --hostname pg-node2 --monitor postgres://autoctl_node@pg-monitor:5432/pg_auto_failover?sslmode=disable --auth trust --no-ssl"
        fi
        exec su - postgres -c "HOME=/var/lib/postgres/pg_autoctl-home pg_autoctl run --pgdata /var/lib/postgres/pgaf"

  pg-node3:
